services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: banco_xyz_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - banco-network

  auth-server:
    build: ./auth-server
    container_name: banco_xyz_auth
    ports:
      - "9000:9000"
    restart: on-failure
    networks:
      - banco-network

  config-server:
    build: ./config-server
    container_name: banco_xyz_config
    ports:
      - "8888:8888"
    restart: on-failure
    networks:
      - banco-network

  discovery-server:
    build: ./discovery-server
    container_name: banco_xyz_discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      - config-server
    restart: on-failure
    networks:
      - banco-network

  account-service:
    build: ./account-service
    container_name: banco_xyz_account
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - kafka
    restart: on-failure
    networks:
      - banco-network

  transaction-service:
    build: ./transaction-service
    container_name: banco_xyz_transaction
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - kafka
      - account-service
    restart: on-failure
    networks:
      - banco-network

  customer-service:
    build: ./customer-service
    container_name: banco_xyz_customer
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
    depends_on:
      - config-server
      - discovery-server
      - auth-server
    restart: on-failure
    networks:
      - banco-network

networks:
  banco-network:
    driver: bridge
