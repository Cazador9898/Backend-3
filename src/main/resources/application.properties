spring.application.name=banco-xyz-bff
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_xyz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:banco}
spring.datasource.password=${DB_PASSWORD:banco123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always

# La semana 4 deja el servidor REST levantado. Los jobs batch no se ejecutan al iniciar,
# salvo que se active expresamente esta propiedad.
app.batch.run-on-startup=${BATCH_RUN_ON_STARTUP:false}
app.job.name=${APP_JOB_NAME:all}
app.batch.chunk-size=${BATCH_CHUNK_SIZE:5}
app.batch.threads=${BATCH_THREADS:3}

# Tokens académicos separados por canal para demostrar autenticación/autorización BFF.
app.bff.web-token=${BFF_WEB_TOKEN:web-xyz-2026}
app.bff.mobile-token=${BFF_MOBILE_TOKEN:mobile-xyz-2026}
app.bff.atm-token=${BFF_ATM_TOKEN:atm-xyz-2026}

logging.level.org.springframework.batch=INFO
logging.file.name=logs/banco-xyz-bff.log
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
